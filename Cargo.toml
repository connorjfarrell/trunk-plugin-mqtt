[package]
# Your plugin's id: lowercase letters, digits and dashes. It names the
# executable, the release files and the plugin's entry in the registry.
name = "mqtt"
version = "0.1.0"
edition = "2024"
description = "Publishes system status and call statistics over MQTT, for Home Assistant, Telegraf and Grafana."
license = "MIT"
repository = "https://github.com/connorjfarrell/trunk-plugin-mqtt"
authors = ["Connor Farrell <connor@connorjfarrell.com>"]
publish = false

[dependencies]
trunk-recorder-plugin = "0.3.0"
# The settings form is drawn from your config structs' JSON Schema. Keep the
# major version the SDK uses (1).
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls"] }

[profile.release]
strip = true
lto = true
